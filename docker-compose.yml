services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: freightforge
      POSTGRES_USER: freightforge
      POSTGRES_PASSWORD: freightforge
    ports:
      - "5432:5432"
    volumes:
      - freightforge_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freightforge -d freightforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://freightforge:freightforge@db:5432/freightforge
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  freightforge_postgres:
